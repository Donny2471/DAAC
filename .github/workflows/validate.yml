name: Validate product definitions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install jsonschema==4.26.0
      - name: Validate specifications and repository integrity
        run: python validate.py --report validation-report.json
      - name: Retain build validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-definition-validation
          path: validation-report.json
          retention-days: 30
          if-no-files-found: warn
